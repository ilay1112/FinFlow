<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>tbiz | ניהול הוצאות לעוסק פטור והפקת קבלות דיגיטליות</title>

    <!-- FF-WEB-10: installable / iOS Add-to-Home-Screen standalone launch -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS home-screen standalone detection still keys off the Apple-prefixed
         tag even though `mobile-web-app-capable` is the modern standard one
         (same dual-tag approach as second-brain's layout.tsx, TKT-OPS-2) —
         set both explicitly since Vite has no metadata convention to do it
         for us. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default" (white bar, dark text, non-translucent) rather than
         "black-translucent": tbiz is a light-themed app (bg #F8FAFC / white
         header, see body style below) — "default" matches the header's light
         look, whereas "black-translucent" would draw content under a status
         bar meant for a dark app and needs extra safe-area handling we don't
         have. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="tbiz" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="description" content="tbiz - ניהול כספים לעסק הקטן שלך. חשבוניות, קבלות ומעקב הוצאות לעוסק פטור ומורשה. הנתונים שלך נשארים אצלך, ב-Google Drive." />
    <meta property="og:title" content="tbiz | ניהול הוצאות לעוסק פטור והפקת קבלות דיגיטליות" />
    <meta property="og:description" content="tbiz - ניהול כספים לעסק הקטן שלך. חשבוניות, קבלות ומעקב הוצאות לעוסק פטור ומורשה. הנתונים שלך נשארים אצלך, ב-Google Drive." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="tbiz" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <style>
        body {
          margin: 0;
          background-color: #F8FAFC; /* tailwind slate-50 */
          font-family: 'Heebo', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .app-shell {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          height: 100dvh;
        }
        .tbiz-spinner {
          width: 48px;
          height: 48px;
          border: 4px solid rgba(37, 99, 235, 0.15); /* tailwind blue-600 low opacity */
          border-top-color: #2563EB; /* tailwind blue-600 */
          border-radius: 50%;
          animation: tbiz-spin 1s linear infinite;
          margin-bottom: 20px;
        }
        @keyframes tbiz-spin {
          to { transform: rotate(360deg); }
        }
        .loading-text {
          color: #1E293B; /* tailwind slate-800 */
          font-size: 16px;
          font-weight: 500;
          letter-spacing: 0.5px;
        }
      </style>
      <div class="app-shell">
        <div class="tbiz-spinner"></div>
        <div class="loading-text">טוען את הנתונים...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
